<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ sơ cá nhân - Quản lý chi tiêu cá nhân</title>
  <link rel="stylesheet" href="profile.css" />
</head>
<body class="profile-body">
  <div class="auth-page">
    <!-- Thanh điều hướng phía trên -->
    <header class="top-nav-pill">
      <a href="login.html" class="btn-top-gray" id="logoutTopBtn">Đăng xuất</a>
      <a href="home.html" class="btn-top-gray">Quay lại trang chủ</a>
    </header>

    <!-- Thẻ hoàn thiện hồ sơ ở giữa -->
    <main class="profile-card-wrap">
      <section class="profile-card" aria-labelledby="profileHeading">
        <h1 id="profileHeading">Hoàn thiện hồ sơ</h1>
        <p class="card-subtitle">
          Vui lòng cung cấp thêm thông tin để thiết lập tài<br />
          khoản của bạn
        </p>

        <form id="profileForm" novalidate>
          <div class="form-field">
            <label for="fullNameInput">Họ và tên</label>
            <input type="text" id="fullNameInput" name="fullname" autocomplete="name" required />
          </div>

          <div class="form-field">
            <label for="phoneInput">Số điện thoại</label>
            <input type="tel" id="phoneInput" name="phone" autocomplete="tel" required />
          </div>

          <div class="form-field">
            <label for="genderInput">Giới tính</label>
            <input
              type="text"
              id="genderInput"
              name="gender"
              list="genderOptions"
              autocomplete="sex"
              required
            />
            <datalist id="genderOptions">
              <option value="Nam"></option>
              <option value="Nữ"></option>
              <option value="Khác"></option>
            </datalist>
          </div>

          <p class="form-feedback" id="profileFeedback" role="alert" aria-live="polite"></p>

          <button type="submit" class="btn-complete-cyan">Hoàn tất &amp; Bắt đầu</button>
        </form>
      </section>
    </main>
  </div>

  <script src="profile.js"></script>
</body>
</html>
