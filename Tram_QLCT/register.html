<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng kí - Quản lý chi tiêu cá nhân</title>
  <link rel="stylesheet" href="register.css" />
</head>
<body class="register-body">
  <div class="auth-page">
    <!-- Thanh điều hướng phía trên -->
    <header class="top-nav-pill">
      <a href="home.html" class="btn-back-home">Quay lại trang chủ</a>

      <p class="switch-auth-text">
        Đã có tài khoản? <a href="login.html" class="switch-auth-link">Đăng nhập ngay</a>
      </p>
    </header>

    <!-- Thẻ form đăng ký -->
    <main class="register-card-wrap">
      <section class="register-card" aria-labelledby="registerHeading">
        <h1 id="registerHeading">Đăng ký</h1>
        <p class="card-subtitle">Tạo tài khoản mới để quản lí tài chính của bạn</p>

        <form id="registerForm" novalidate>
          <div class="form-field">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" name="email" autocomplete="email" required />
          </div>

          <div class="form-field">
            <label for="regPassword">Mật khẩu</label>
            <input type="password" id="regPassword" name="password" autocomplete="new-password" required />
          </div>

          <div class="form-field">
            <label for="regConfirmPassword">Nhập lại mật khẩu</label>
            <input
              type="password"
              id="regConfirmPassword"
              name="confirmPassword"
              autocomplete="new-password"
              required
            />
          </div>

          <p class="form-feedback" id="registerFeedback" role="alert" aria-live="polite"></p>

          <button type="submit" class="btn-submit-cyan">Đăng ký</button>
        </form>

        <div class="social-divider">Hoặc đăng kí bằng</div>

        <button type="button" class="btn-google-icon" id="googleRegisterBtn" aria-label="Đăng ký bằng Google">
          <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true">
            <circle cx="18" cy="18" r="17" fill="#0b0c0e" />
            <text
              x="18"
              y="24.5"
              text-anchor="middle"
              fill="#ffffff"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="700"
            >G</text>
          </svg>
        </button>
      </section>
    </main>
  </div>

  <script src="register.js"></script>
</body>
</html>
