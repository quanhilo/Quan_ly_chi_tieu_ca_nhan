<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu - Quản lý chi tiêu cá nhân</title>
  <link rel="stylesheet" href="forgot-password.css" />
</head>
<body class="forgot-body">
  <div class="auth-page">
    <!-- Thanh điều hướng phía trên -->
    <header class="top-nav-pill">
      <a href="home.html" class="btn-back-home">Quay lại trang chủ</a>
    </header>

    <!-- Thẻ quên mật khẩu ở giữa -->
    <main class="forgot-card-wrap">
      <section class="forgot-card" aria-labelledby="forgotHeading">
        <h1 id="forgotHeading">Quên mật khẩu?</h1>

        <p class="forgot-desc">
          Nhập email của bạn đã đăng kí tài khoản. Chúng<br />
          tôi sẽ gửi liên kết hoặc mã OTP để khôi phục<br />
          mật khẩu
        </p>

        <form id="forgotForm" novalidate>
          <div class="form-field">
            <label for="forgotEmail">Email</label>
            <input type="email" id="forgotEmail" name="email" autocomplete="email" required />
          </div>

          <p class="form-feedback" id="forgotFeedback" role="alert" aria-live="polite"></p>

          <button type="submit" class="btn-send-otp">Gửi mã OTP/ Liên kết</button>
        </form>

        <a href="login.html" class="back-login-link">Quay lại Đăng nhập</a>
      </section>
    </main>
  </div>

  <script src="forgot-password.js"></script>
</body>
</html>
