<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu - Quản lý chi tiêu cá nhân</title>
  <link rel="stylesheet" href="forgot-password.css" />
</head>
<body class="auth-page">
  <header class="auth-topbar">
    <div class="auth-topbar-inner">
      <a href="index.html" class="btn-back-home">Quay lại trang chủ</a>
    </div>
  </header>

  <main class="auth-main">
    <section class="forgot-card">
      <div class="forgot-header">
        <h1>Quên mật khẩu?</h1>
        <p>
          Nhập email của bạn đã đăng kí tài khoản. Chúng tôi sẽ gửi liên kết hoặc mã OTP để khôi phục mật khẩu
        </p>
      </div>

      <div id="forgotMessage" class="alert-box"></div>

      <form id="forgotPasswordForm" novalidate>
        <div class="pill-form-group">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" name="forgotEmail" required />
        </div>

        <div class="forgot-submit-wrap">
          <button type="submit" class="btn-cyan-pill">Gửi mã OTP/ Liên kết</button>
        </div>

        <div class="forgot-back-wrap">
          <a href="login.html">Quay lại Đăng nhập</a>
        </div>
      </form>
    </section>
  </main>

  <script src="tram_main.js"></script>
</body>
</html>
