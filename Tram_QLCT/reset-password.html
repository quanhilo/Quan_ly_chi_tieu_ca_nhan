<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lại mật khẩu - Quản lý chi tiêu cá nhân</title>
  <link rel="stylesheet" href="reset-password.css" />
</head>
<body class="reset-body">
  <div class="auth-page">
    <!-- Thanh điều hướng phía trên -->
    <header class="top-nav-pill">
      <a href="home.html" class="btn-back-home">Quay lại trang chủ</a>
    </header>

    <!-- Thẻ đặt lại mật khẩu ở giữa -->
    <main class="reset-card-wrap">
      <section class="reset-card" aria-labelledby="resetHeading">
        <h1 id="resetHeading">Đặt lại mật khẩu</h1>

        <p class="reset-desc">
          Nhập mã OTP đã được gửi đến email của bạn<br />
          và thiết lập mật khẩu mới
        </p>

        <form id="resetForm" novalidate>
          <div class="form-field">
            <label for="otpInput">Mã xác thực OTP</label>
            <input type="text" id="otpInput" name="otp" inputmode="numeric" maxlength="8" required />
          </div>

          <div class="form-field">
            <label for="newPasswordInput">Mật khẩu mới</label>
            <input
              type="password"
              id="newPasswordInput"
              name="newPassword"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="form-field">
            <label for="confirmNewPasswordInput">Nhập lại mật khẩu mới</label>
            <input
              type="password"
              id="confirmNewPasswordInput"
              name="confirmNewPassword"
              autocomplete="new-password"
              required
            />
          </div>

          <p class="form-feedback" id="resetFeedback" role="alert" aria-live="polite"></p>

          <button type="submit" class="btn-confirm-reset">Xác nhận đặt lại mật khẩu</button>
        </form>

        <a href="login.html" class="back-login-link">Quay lại Đăng nhập</a>
      </section>
    </main>
  </div>

  <script src="reset-password.js"></script>
</body>
</html>
