<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lại mật khẩu - Quản lý chi tiêu cá nhân</title>
  <link rel="stylesheet" href="reset-password.css" />
</head>
<body class="auth-page">
  <header class="auth-topbar">
    <div class="auth-topbar-inner">
      <a href="index.html" class="btn-back-home">Quay lại trang chủ</a>
    </div>
  </header>

  <main class="auth-main">
    <section class="reset-card">
      <div class="reset-header">
        <h1>Đặt lại mật khẩu</h1>
        <p>Nhập mã OTP đã được gửi đến email của bạn và thiết lập mật khẩu mới</p>
      </div>

      <div id="resetMessage" class="alert-box"></div>

      <form id="resetPasswordForm" novalidate>
        <div class="pill-form-group">
          <label for="otpCode">Mã xác thực OTP</label>
          <input type="text" id="otpCode" name="otpCode" maxlength="6" required />
        </div>

        <div class="pill-form-group">
          <label for="newPassword">Mật khẩu mới</label>
          <input type="password" id="newPassword" name="newPassword" required />
        </div>

        <div class="pill-form-group">
          <label for="confirmNewPassword">Nhập lại mật khẩu mới</label>
          <input type="password" id="confirmNewPassword" name="confirmNewPassword" required />
        </div>

        <div class="reset-submit-wrap">
          <button type="submit" class="btn-cyan-pill">Xác nhận đặt lại mật khẩu</button>
        </div>

        <div class="reset-back-wrap">
          <a href="login.html">Quay lại Đăng nhập</a>
        </div>
      </form>
    </section>
  </main>

  <script src="tram_main.js"></script>
</body>
</html>
