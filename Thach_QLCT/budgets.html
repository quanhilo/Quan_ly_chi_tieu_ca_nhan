<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý Ngân sách - Quản lý chi tiêu cá nhân</title>
  <link rel="stylesheet" href="budgets.css" />
</head>
<body class="budgets-body">
  <div class="app-layout">
    <!-- Sidebar trái -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand-title">Quản lý chi tiêu<br />cá nhân</div>

        <nav class="sidebar-nav" aria-label="Điều hướng chính">
          <a href="index.html" class="nav-item">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <line x1="3" y1="10" x2="21" y2="10" />
                <line x1="9" y1="10" x2="9" y2="20" />
              </svg>
            </span>
            <span>Bảng điều khiển</span>
          </a>

          <a href="history.html" class="nav-item">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9" />
                <polyline points="12 7 12 12 15 14" />
              </svg>
            </span>
            <span>Lịch sử giao dịch</span>
          </a>

          <a href="#" class="nav-item" data-nav="wallets">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
            </span>
            <span>Quản lý ví<br />nguồn tiền</span>
          </a>

          <a href="categories.html" class="nav-item">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" />
              </svg>
            </span>
            <span>Quản lý danh mục</span>
          </a>

          <a href="budgets.html" class="nav-item active">
            <span class="nav-icon s-icon" aria-hidden="true">S</span>
            <span>Ngân sách</span>
          </a>

          <a href="#" class="nav-item" data-nav="reports">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="4" y1="4" x2="4" y2="20" />
                <line x1="4" y1="20" x2="20" y2="20" />
                <line x1="9" y1="10" x2="9" y2="17" />
                <line x1="14" y1="7" x2="14" y2="17" />
                <line x1="19" y1="12" x2="19" y2="17" />
              </svg>
            </span>
            <span>Báo cáo</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <a href="login.html" class="nav-item logout-item" id="logoutLink">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5" />
              <polyline points="15 16 20 12 15 8" />
              <line x1="20" y1="12" x2="9" y2="12" />
            </svg>
          </span>
          <span>Đăng xuất</span>
        </a>
      </div>
    </aside>

    <!-- Nội dung chính -->
    <main class="main-content">
      <header class="page-header">
        <div>
          <h1>Quản lý Ngân sách</h1>
          <p id="greetingUser">Xin chào, Nguyễn Văn A!</p>
        </div>

        <div class="cycle-note" id="cycleDisplay">Chu kì: Tháng 11/2026</div>
      </header>

      <!-- Bộ lọc & nút thêm ngân sách -->
      <section class="filter-controls">
        <div class="filter-group">
          <label for="cycleSelect">Chu kỳ</label>
          <select id="cycleSelect" class="pill-select">
            <option value="Tháng 11/2026" selected>Tháng 11/2026</option>
            <option value="Tháng 10/2026">Tháng 10/2026</option>
            <option value="Tháng 09/2026">Tháng 09/2026</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="statusFilter">Loại</label>
          <select id="statusFilter" class="pill-select">
            <option value="all" selected>Loại</option>
            <option value="safe">An toàn</option>
            <option value="warning">Cảnh báo</option>
            <option value="near-limit">Sắp vượt mức</option>
            <option value="exceeded">Đã vượt</option>
          </select>
        </div>

        <button type="button" class="btn-add-budget" id="openAddBudgetBtn">+ Thêm ngân sách</button>
      </section>

      <h2 class="list-heading">Danh sách</h2>

      <!-- Danh sách thẻ ngân sách -->
      <section class="budget-list" id="budgetList"></section>
    </main>
  </div>

  <!-- Modal thêm / sửa ngân sách -->
  <div class="modal-backdrop" id="budgetModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="budgetModalTitle">Thêm ngân sách</h3>
        <button type="button" class="modal-close" id="closeBudgetModal" aria-label="Đóng">✕</button>
      </div>
      <form id="budgetForm">
        <input type="hidden" id="editBudgetId" />
        <div class="modal-field">
          <label for="budgetCategoryInput">Tên danh mục</label>
          <input type="text" id="budgetCategoryInput" placeholder="Ví dụ: Ăn uống" required />
        </div>
        <div class="modal-field">
          <label for="budgetSpentInput">Đã chi (đ)</label>
          <input type="number" id="budgetSpentInput" placeholder="2000000" min="0" required />
        </div>
        <div class="modal-field">
          <label for="budgetLimitInput">Hạn mức (đ)</label>
          <input type="number" id="budgetLimitInput" placeholder="5000000" min="1" required />
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-save-budget">Lưu ngân sách</button>
        </div>
      </form>
    </div>
  </div>

  <script src="budgets.js"></script>
</body>
</html>
